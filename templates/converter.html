<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meters to Feet</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f2e8; color: #213345; font: 1rem/1.55 system-ui, sans-serif; }
    main { width: min(42rem, calc(100% - 2rem)); margin: 3rem auto; }
    header { display: flex; align-items: center; gap: 1rem; background: #23415d; color: white; border-radius: 1rem 1rem 0 0; padding: 1.4rem; }
    h1 { font-size: clamp(1.8rem, 5vw, 3.35rem); letter-spacing: -.045em; line-height: 1.05; margin: 0; }
    .ruler { width: 3.25rem; flex: none; height: 1.75rem; border: 3px solid #f1c87c; border-radius: .2rem; background: repeating-linear-gradient(90deg,#f1c87c 0 2px, transparent 2px 10px) no-repeat 0 0 / 100% 40%; transform: rotate(-14deg); }
    section { background: white; padding: 1.4rem; border-radius: 0 0 1rem 1rem; }
    form { display: grid; gap: .5rem; align-items: end; }
    label { font-weight: 700; }
    input, button { font: inherit; padding: .55rem .7rem; border-radius: .4rem; }
    input { width: 100%; border: 1px solid #536d83; }
    button { border: 1px solid #23415d; background: #23415d; color: white; cursor: pointer; justify-self: start; }
    .result { font-size: 1.45rem; font-weight: 750; overflow-wrap: anywhere; }
    .error { color: #9d301f; }
    a { color: #23415d; }
  </style>
</head>
<body>
<main>
  <header><span class="ruler" aria-hidden="true"></span><h1>Meters to Feet</h1></header>
  <section>
    <form method="get" action="/">
      <label for="meters">Length in meters</label>
      <input id="meters" name="meters" inputmode="decimal" value="{{ value|default('') }}" required maxlength="22">
      <button>Convert to feet</button>
    </form>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% if feet is defined %}<p class="result" role="status">{{ feet }} ft</p>{% endif %}
    <p><a href="/api/convert?meters=1">Try the JSON API</a> · <a href="https://www.nist.gov/pml/us-surveyfoot/revised-unit-conversion-factors">NIST conversion standard</a></p>
  </section>
</main>
</body>
</html>
